paths:
  /assets:
    get:
      consumes:
      - application/json
      description: Get a paginated list of assets
      parameters:
      - description: Number of items per page
        format: int32
        in: query
        name: limit
        type: integer
      - description: Pagination cursor for next page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-array_github_com_gianghp123_Vidmerce_backend_internal_modules_assets_dtos_res_AssetRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-any'
      summary: List assets
      tags:
      - assets
    post:
      consumes:
      - application/json
      description: Create a new asset with name, price, product URL and image count
      parameters:
      - description: Create asset request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_modules_assets_dtos_req.CreateAssetReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-github_com_gianghp123_Vidmerce_backend_internal_modules_assets_dtos_res_CreateAssetRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-any'
      summary: Create a new asset
      tags:
      - assets
  /assets/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific asset
      parameters:
      - description: Asset ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-github_com_gianghp123_Vidmerce_backend_internal_modules_assets_dtos_res_AssetRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-any'
      summary: Get asset by ID
      tags:
      - assets
  /assets/{id}/confirm:
    post:
      consumes:
      - application/json
      description: Confirm upload for an asset and generate image URLs
      parameters:
      - description: Asset ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-github_com_gianghp123_Vidmerce_backend_internal_modules_assets_dtos_res_ConfirmAssetRes'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-any'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_gianghp123_Vidmerce_backend_internal_core_response.BaseResponse-any'
      summary: Confirm asset upload
      tags:
      - assets
