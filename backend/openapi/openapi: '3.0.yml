openapi: '3.0.3'
info:
  title: Vidmerce API
  description: API for interactive video commerce platform
  version: '1.0'
servers:
  - url: https://api.server.test/v1

paths:
  /assets:
    post:
      summary: Create asset and get upload URLs
      description: Creates an asset record with UPLOADING status and returns presigned S3 upload URLs for multiple images
      operationId: createAsset
      tags:
        - Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssetRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CreateAssetResponse'
    get:
      summary: List assets
      description: Fetches a paginated list of available assets
      operationId: listAssets
      tags:
        - Assets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  nextCursor:
                    type: string
                    nullable: true

  /assets/{id}:
    get:
      summary: Get asset details
      description: Returns asset metadata and all images
      operationId: getAsset
      tags:
        - Assets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Asset'

  /assets/{id}/confirm:
    post:
      summary: Confirm asset upload
      description: Verifies all images were uploaded to S3 and marks asset as COMPLETED
      operationId: confirmAssetUpload
      tags:
        - Assets
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ConfirmAssetResponse'

  /videos:
    post:
      summary: Create video
      description: Accepts a composition configuration, saves to DB, and dispatches a job for the FFmpeg worker
      operationId: createVideo
      tags:
        - Videos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVideoRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CreateVideoResponse'
    get:
      summary: List videos
      description: Lists available interactive videos
      operationId: listVideos
      tags:
        - Videos
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VideoSummary'
                  nextCursor:
                    type: string
                    nullable: true

  /videos/{id}:
    get:
      summary: Get video details
      description: Returns the core video playback URL and the interactive overlay data
      operationId: getVideo
      tags:
        - Videos
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VideoDetail'

components:
  schemas:
    UploadInfo:
      type: object
      properties:
        fileKey:
          type: string
        uploadUrl:
          type: string
        order:
          type: integer
        expiresIn:
          type: integer

    ImageInfo:
      type: object
      properties:
        imageUrl:
          type: string
        order:
          type: integer

    CreateAssetRequest:
      type: object
      required:
        - name
        - price
        - productUrl
      properties:
        name:
          type: string
        price:
          type: number
        productUrl:
          type: string
        imageCount:
          type: integer
          minimum: 1
          maximum: 10
          default: 1

    CreateAssetResponse:
      type: object
      properties:
        assetId:
          type: string
        status:
          type: string
          enum:
            - UPLOADING
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/UploadInfo'

    ConfirmAssetResponse:
      type: object
      properties:
        assetId:
          type: string
        status:
          type: string
          enum:
            - COMPLETED
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageInfo'

    Asset:
      type: object
      properties:
        assetId:
          type: string
        name:
          type: string
        price:
          type: number
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageInfo'
        productUrl:
          type: string
        status:
          type: string
          enum: 
            - UPLOADING
            - COMPLETED
        createdAt:
          type: string
          format: date-time

    VideoItem:
      type: object
      required:
        - assetId
        - duration
        - transition
      properties:
        assetId:
          type: string
        duration:
          type: integer
        transition:
          type: string
          enum:
            - FADE
            - SLIDE

    CreateVideoRequest:
      type: object
      required:
        - title
        - style
        - items
      properties:
        title:
          type: string
        style:
          type: string
          enum:
            - KEN_BURNS
        items:
          type: array
          items:
            $ref: '#/components/schemas/VideoItem'

    CreateVideoResponse:
      type: object
      properties:
        videoId:
          type: string
        status:
          type: string
          enum:
            - PROCESSING
        message:
          type: string

    Hotspot:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number

    AssetSnapshot:
      type: object
      properties:
        assetId:
          type: string
        name:
          type: string
        price:
          type: number
        imageUrl:
          type: string
        productUrl:
          type: string

    InteractiveLayer:
      type: object
      properties:
        startTime:
          type: number
        endTime:
          type: number
        hotspot:
          $ref: '#/components/schemas/Hotspot'
        asset:
          $ref: '#/components/schemas/AssetSnapshot'

    VideoDetail:
      type: object
      properties:
        videoId:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
            - PROCESSING
            - READY
            - FAILED
        videoUrl:
          type: string
        thumbnailUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        interactiveLayer:
          type: array
          items:
            $ref: '#/components/schemas/InteractiveLayer'

    VideoSummary:
      type: object
      properties:
        videoId:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
            - PROCESSING
            - READY
            - FAILED
        thumbnailUrl:
          type: string
        createdAt:
          type: string
          format: date-time
